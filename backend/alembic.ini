# Alembic configuration for PulseLink's local PostgreSQL (+PostGIS) schema.
#
# The database URL is NOT hard-coded here: migrations/env.py reads DATABASE_URL
# from the application config seam (pulselink.common.config) so the same
# connection string drives the services and the migrations. Local PostgreSQL
# maps to RDS db.t3.micro (PostgreSQL + PostGIS) in the budget prod profile.
#
# Common commands (run from the backend/ directory):
#   alembic upgrade head            # apply all migrations to the live DB
#   alembic upgrade head --sql      # render SQL offline (no DB connection)
#   alembic downgrade -1            # revert the most recent migration

[alembic]
script_location = migrations
prepend_sys_path = .
# Timestamped, slug-friendly revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

# sqlalchemy.url is intentionally left blank; env.py injects it from
# pulselink.common.config (DATABASE_URL). A placeholder keeps tooling happy.
sqlalchemy.url =

[post_write_hooks]
# (none configured)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
